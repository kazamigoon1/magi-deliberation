name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tests/skill_contract_test.py
      - run: python tests/readme_contract_test.py
      - run: python tests/license_contract_test.py
      - run: python tests/m365_personal_agent_contract_test.py
